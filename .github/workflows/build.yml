name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions: {}
jobs:
  verify:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and package
        shell: pwsh
        run: |
          ./build.ps1
          ./pack.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Get-ChildItem -LiteralPath build -Filter "Persik-*-Windows.zip"
          gh release create $env:GITHUB_REF_NAME $bundle.FullName build/SHA256SUMS.txt build/PixelCat.exe --verify-tag --title "Persik $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md
